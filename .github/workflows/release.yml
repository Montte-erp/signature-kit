name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build
      - name: Run static and type checks
        run: bun run check
      - name: Run non-browser tests
        run: bun run test
      - name: Validate publish plan
        run: bun run release publish --dry-run
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Version or publish packages
        run: bun run release ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
